<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CCOS Everfit sync</title>
    <link rel="stylesheet" href="runner.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">CCOS · EVERFIT</p>
      <h1>Sync in progress</h1>
      <p id="message" role="status">Connecting…</p>
      <progress id="progress" max="1" value="0"></progress>
      <p>
        Keep Chrome and this tab open while the sync runs. You can use CCOS in
        your other tab.
      </p>
      <p id="counts"></p>
      <button id="cancel">Stop sync</button>
    </main>
    <script src="runner.js"></script>
  </body>
</html>
